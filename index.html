<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITSUBOSHI PORTAL | 三つ星パティシエ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --border-color: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Serif JP', serif;
      line-height: 1.8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .header-actions {
      position: absolute;
      top: 0;
      right: 0;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin: 0;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 5px;
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 30px;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .item-card {
      padding: 15px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .item-card:last-child {
      border-bottom: none;
    }

    .item-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #ffffff;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--gold-hover);
      margin-top: 4px;
    }

    .item-content {
      margin-top: 8px;
      white-space: pre-wrap;
      color: var(--text-main);
    }

    .btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
    }

    .btn:hover {
      background: var(--gold);
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-actions">
        <a href="/admin/" class="btn">ログイン / 管理画面</a>
      </div>
      <h1>MITSUBOSHI PORTAL</h1>
      <div class="subtitle">Ensemble Team Portal</div>
    </header>

    <!-- SCHEDULE SECTION -->
    <div class="section">
      <h2>SCHEDULE</h2>
      <div id="schedule-list">
        <p style="color: var(--text-muted);">読み込み中...</p>
      </div>
    </div>

    <!-- INFORMATION SECTION -->
    <div class="section">
      <h2>INFORMATION</h2>
      <div id="info-list">
        <p style="color: var(--text-muted);">読み込み中...</p>
      </div>
    </div>

    <footer>
      &copy; MITSUBOSHI PORTAL | <a href="/admin/">管理画面へ</a>
    </footer>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. 直接ファイルを読み込んで確実にテスト表示
      await loadDirect('schedule-list', true);
      await loadDirectInfo('info-list');
    });

    async function loadDirect(elementId, isSchedule) {
      const container = document.getElementById(elementId);
      
      // GitHubから直接コミットされたファイルを読み込むための相対パスリスト
      const targetPaths = [
        '/content/schedule/2026-09-30-アンサンブル発表会.md',
        'content/schedule/2026-09-30-アンサンブル発表会.md'
      ];

      for (const path of targetPaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const text = await res.text();
            const item = parseFrontmatter(text);
            container.innerHTML = `
              <div class="item-card">
                <div class="item-title">${escapeHtml(item.title || 'アンサンブル発表会')}</div>
                <div class="item-meta">📅 日時: ${escapeHtml(item.date || '')} ${item.location ? ' | 📍 場所: ' + escapeHtml(item.location) : ''}</div>
                ${item.body ? `<div class="item-content">${escapeHtml(item.body)}</div>` : ''}
              </div>
            `;
            return;
          }
        } catch (e) {}
      }

      container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
    }

    async function loadDirectInfo(elementId) {
      const container = document.getElementById(elementId);
      container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
    }

    function parseFrontmatter(text) {
      const result = { title: '', date: '', location: '', body: '' };
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (match) {
        result.body = match[2].trim();
        match[1].split('\n').forEach(line => {
          const parts = line.split(':');
          if (parts.length >= 2) {
            const key = parts[0].trim();
            const value = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
            result[key] = value;
          }
        });
      } else {
        result.body = text.trim();
      }
      return result;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
