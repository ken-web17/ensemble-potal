<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITSUBOSHI PORTAL | 三つ星パティシエ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --border-color: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Serif JP', serif;
      line-height: 1.8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .header-actions {
      position: absolute;
      top: 0;
      right: 0;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin: 0;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 5px;
    }

    /* Section & Cards */
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 30px;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .item-card {
      padding: 15px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .item-card:last-child {
      border-bottom: none;
    }

    .item-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .item-content {
      margin-top: 8px;
      white-space: pre-wrap;
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
    }

    .btn:hover {
      background: var(--gold);
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-actions">
        <a href="/admin/" class="btn">ログイン / 管理画面</a>
      </div>
      <h1>MITSUBOSHI PORTAL</h1>
      <div class="subtitle">三つ星パティシエ</div>
    </header>

    <!-- SCHEDULE SECTION -->
    <div class="section">
      <h2>SCHEDULE</h2>
      <div id="schedule-list">読み込み中...</div>
    </div>

    <!-- INFORMATION SECTION -->
    <div class="section">
      <h2>INFORMATION</h2>
      <div id="info-list">読み込み中...</div>
    </div>

    <footer>
      &copy; MITSUBOSHI PORTAL
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadContent('content/schedule', 'schedule-list', true);
      loadContent('content/pages', 'info-list', false);
    });

    async function loadContent(folderPath, elementId, isSchedule) {
      const container = document.getElementById(elementId);
      try {
        const res = await fetch(`https://api.github.com/repos/ken-web17/ensemble-potal/contents/${folderPath}`);
        if (!res.ok) {
          container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
          return;
        }
        
        const files = await res.json();
        if (!Array.isArray(files) || files.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
          return;
        }

        const items = await Promise.all(files.map(async (file) => {
          if (!file.name.endsWith('.md')) return null;
          const fileRes = await fetch(file.download_url);
          const text = await fileRes.text();
          return parseFrontmatter(text);
        }));

        const validItems = items.filter(i => i !== null);
        if (validItems.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
          return;
        }

        container.innerHTML = validItems.map(item => `
          <div class="item-card">
            <div class="item-title">${item.title || '無題'}</div>
            ${isSchedule ? `<div class="item-meta">日時: ${item.date \vert{}\vert{} ''}${item.location ? '| 場所: ' + item.location : ''}</div>` : ''}
            ${item.body ? `<div class="item-content">${item.body}</div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color: var(--text-muted);">データの取得に失敗しました。</p>';
      }
    }

    function parseFrontmatter(text) {
      const result = { title: '', date: '', location: '', body: '' };
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (match) {
        result.body = match[2].trim();
        match[1].split('\n').forEach(line => {
          const parts = line.split(':');
          if (parts.length >= 2) {
            const key = parts[0].trim();
            const value = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
            result[key] = value;
          }
        });
      } else {
        result.body = text.trim();
      }
      return result;
    }
  </script>
</body>
</html>
