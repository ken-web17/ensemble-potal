<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITSUBOSHI PORTAL | 三つ星パティシエ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --border-color: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Serif JP', serif;
      line-height: 1.8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .header-actions {
      position: absolute;
      top: 0;
      right: 0;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin: 0;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-top: 5px;
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 30px;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .item-card {
      padding: 15px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .item-card:last-child {
      border-bottom: none;
    }

    .item-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .item-content {
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
    }

    .btn:hover {
      background: var(--gold);
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-actions">
        <a href="/admin/" class="btn">ログイン / 管理画面</a>
      </div>
      <h1>MITSUBOSHI PORTAL</h1>
      <div class="subtitle">Ensemble Team Portal</div>
    </header>

    <!-- SCHEDULE SECTION -->
    <div class="section">
      <h2>SCHEDULE</h2>
      <div id="schedule-list">
        <p style="color: var(--text-muted);">まだ投稿がありません。</p>
      </div>
    </div>

    <!-- INFORMATION SECTION -->
    <div class="section">
      <h2>INFORMATION</h2>
      <div id="info-list">
        <p style="color: var(--text-muted);">まだ投稿がありません。</p>
      </div>
    </div>

    <footer>
      &copy; MITSUBOSHI PORTAL | <a href="/admin/">管理画面へ</a>
    </footer>
  </div>

  <script>
    // 通信処理に頼らず、万が一エラーが起きた場合でも「読み込み中…」で画面がフリーズしない仕様に変更
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchFiles('content/schedule', 'schedule-list', true);
      await fetchFiles('content/pages', 'info-list', false);
    });

    async function fetchFiles(folder, elementId, isSchedule) {
      const container = document.getElementById(elementId);
      
      // リポジトリ名の表記ゆれ（potal / portal）の両方に対応したGitHub APIリクエスト
      const repoNames = ['ensemble-potal', 'ensemble-portal'];
      let files = null;

      for (const repo of repoNames) {
        try {
          const res = await fetch(`https://api.github.com/repos/ken-web17/${repo}/contents/${folder}`);
          if (res.ok) {
            files = await res.json();
            break;
          }
        } catch (e) {
          // 通信エラー時は次のリポジトリ名を試行
        }
      }

      // ファイルが取得できない・投稿がない場合は「まだ投稿がありません。」を表示
      if (!files || !Array.isArray(files) || files.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
        return;
      }

      const mdFiles = files.filter(f => f.name && f.name.endsWith('.md'));
      if (mdFiles.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
        return;
      }

      try {
        const items = await Promise.all(mdFiles.map(async (file) => {
          const fileRes = await fetch(file.download_url);
          if (!fileRes.ok) return null;
          const text = await fileRes.text();
          return parseFrontmatter(text);
        }));

        const validItems = items.filter(i => i !== null);
        if (validItems.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
          return;
        }

        container.innerHTML = validItems.map(item => `
          <div class="item-card">
            <div class="item-title">${escapeHtml(item.title || '無題')}</div>
            ${isSchedule ? `<div class="item-meta">日時: ${escapeHtml(item.date \vert{}\vert{} '')}${item.location ? '| 場所: ' + escapeHtml(item.location) : ''}</div>` : ''}
            ${item.body ? `<div class="item-content">${escapeHtml(item.body)}</div>` : ''}
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<p style="color: var(--text-muted);">まだ投稿がありません。</p>';
      }
    }

    function parseFrontmatter(text) {
      const result = { title: '', date: '', location: '', body: '' };
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (match) {
        result.body = match[2].trim();
        match[1].split('\n').forEach(line => {
          const parts = line.split(':');
          if (parts.length >= 2) {
            const key = parts[0].trim();
            const value = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
            result[key] = value;
          }
        });
      } else {
        result.body = text.trim();
      }
      return result;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
