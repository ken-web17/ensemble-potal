backend:
  name: git-gateway
  branch: main # または master（GitHubのデフォルトブランチ名）

media_folder: "images"
public_folder: "/images"

collections:
  - name: "schedule"
    label: "スケジュール"
    folder: "content/schedule"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "本番名/タイトル", name: "title", widget: "string"}
      - {label: "日時", name: "date", widget: "string"}
      - {label: "場所", name: "location", widget: "string"}
      - {label: "詳細・メモ", name: "body", widget: "markdown", required: false}

  - name: "pages"
    label: "自由ページ・お知らせ"
    folder: "content/pages"
    create: true
    fields:
      - {label: "見出し（タイトル）", name: "title", widget: "string"}
      - {label: "本文", name: "body", widget: "markdown"}
